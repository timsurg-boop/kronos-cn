[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kronos-cn"
version = "0.1.0"
description = "Kronos Workbench: a small, hackable toolkit for K-line data, market heatmaps and forecast evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kronos-CN contributors" }]
keywords = ["kronos", "quant", "heatmap", "a-share", "time-series", "forecasting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.2",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
fetch = ["akshare>=1.12", "tushare>=1.2"]
predict = [
  "torch>=2.0",
  "einops>=0.7",
  "huggingface_hub>=0.20",
  "safetensors>=0.4",
]
dev = ["pytest>=7.4", "ruff==0.17.3"]

[project.scripts]
kronos-cn = "kronos_cn.cli:main"

[project.urls]
Homepage = "https://github.com/timsurg-boop/kronos-cn"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kronos_cn = ["assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kronos_cn"]
